<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portfolio System</title>
  <meta name="description" content="Prototype of a student portfolio system for students, staff, supervisors and administrators.">
  <style>
/* Student Portfolio System — prototype styles
   Plain CSS, no build step. Colours live in :root so the group can re-theme in one place. */
:root {
  --bg: #f3f4f8;
  --card: #ffffff;
  --soft: #eef0f4;
  --line: #c9ced8;
  --line-soft: #e3e6ec;
  --text: #1f2430;
  --muted: #5b6475;
  --accent: #c8191f;
  --accent-soft: #fbe9e9;
  --dark: #151515;
  --green: #1d7a46;
  --green-soft: #e3f3ea;
  --amber: #9a6700;
  --amber-soft: #fdf0cf;
  --red: #b3261e;
  --red-soft: #fbe6e4;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.45; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #e8878b; outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.xs { font-size: .78rem; }
.bold { font-weight: 700; }
.right { text-align: right; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.stack-lg > * + * { margin-top: 18px; }
.grow { flex: 1; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--dark); background: #fff; color: var(--dark);
  border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: .92rem; text-decoration: none; line-height: 1.2; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--dark); color: #fff; }
.btn.primary:hover { background: #3a3a3a; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 5px 10px; font-size: .82rem; border-radius: 7px; }
.btn.block { width: 100%; padding: 11px 14px; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font-weight: 500; }
.chip { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; padding: 4px 13px; cursor: pointer; font-size: .9rem; }
.chip:hover { background: var(--soft); }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chip.static { cursor: default; }
.chip.static:hover { background: #fff; }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; font-size: .84rem; background: #fff; }
.badge { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .78rem; color: var(--muted); background: #fff; white-space: nowrap; }

/* ---------- forms ---------- */
label.field { display: block; font-weight: 700; font-size: .9rem; margin-top: 14px; }
label.field:first-child { margin-top: 0; }
label.field .opt { font-weight: 400; color: var(--muted); }
.input, select.input, textarea.input { display: block; width: 100%; margin-top: 5px; border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; font-weight: 400; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px #f3c4c6; }
textarea.input { min-height: 84px; resize: vertical; }
.input.err { border-color: var(--red); }
.hint { font-size: .8rem; color: var(--muted); margin-top: 4px; font-weight: 400; }
.err-msg { font-size: .82rem; color: var(--red); margin-top: 4px; font-weight: 600; }
.err-msg::before { content: "✕ "; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 62px; }
.pw-wrap button { position: absolute; right: 8px; top: 50%; transform: translateY(-20%); border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .85rem; }
.strength { display: flex; gap: 6px; margin-top: 8px; }
.strength i { flex: 1; height: 5px; border-radius: 4px; background: var(--line-soft); }
.strength.s1 i:nth-child(-n+1) { background: var(--red); }
.strength.s2 i:nth-child(-n+2) { background: var(--amber); }
.strength.s3 i:nth-child(-n+3) { background: var(--accent); }
.strength.s4 i { background: var(--green); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-right: 1px solid var(--line); background: #fff; padding: 9px 4px; cursor: pointer; font-size: .88rem; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; font-weight: 700; }
.rating { display: flex; gap: 5px; }
.rating button { width: 30px; height: 28px; border: 1.5px solid var(--line); background: #fff; border-radius: 5px; cursor: pointer; font-size: .85rem; }
.rating button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.rating.readonly button { cursor: default; }

/* ---------- cards & layout ---------- */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.card.soft { background: var(--soft); border-color: transparent; }
.card.flat { border-color: var(--line-soft); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g-side { grid-template-columns: 1.5fr 1fr; }
.stat { background: var(--soft); border-radius: var(--radius); padding: 14px 16px; }
.stat .lbl { color: var(--muted); font-size: .86rem; }
.stat .num { font-size: 1.9rem; font-weight: 800; line-height: 1.15; margin: 2px 0; }
.stat .sub { font-size: .8rem; }
.good { color: var(--green); }
.warn { color: var(--amber); }
.bad { color: var(--red); }
.accent-text { color: var(--accent); }
.banner { border-radius: 9px; padding: 11px 14px; font-size: .92rem; }
.banner.warn { background: var(--amber-soft); color: #6b4700; }
.banner.info { background: #eef1f6; color: #2a3550; }
.banner.ok { background: var(--green-soft); color: #14582f; }
.banner.err { background: var(--red-soft); color: #86190f; }
.progress { height: 8px; background: var(--line-soft); border-radius: 6px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.list > .item { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.list > .item:last-child { border-bottom: 0; }
.list > .item:first-child { padding-top: 2px; }
.dot { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); flex: none; font-size: .85rem; }
.status { font-size: .88rem; font-weight: 600; white-space: nowrap; }
.status.ok { color: var(--green); } .status.wait { color: var(--amber); } .status.info { color: #2a3f9a; } .status.bad { color: var(--red); }
.empty { text-align: center; padding: 26px 14px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--radius); background: #fff; }
.empty b { display: block; color: var(--text); margin-bottom: 4px; }
.crumbs { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin-top: 3px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.tbl th { text-align: left; font-size: .8rem; color: var(--muted); padding: 9px 10px; background: var(--soft); }
table.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line-soft); }
table.tbl .c { text-align: center; }
.avatar { border-radius: 50%; background: var(--soft); border: 1.5px dashed var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); overflow: hidden; flex: none; background-size: cover; background-position: center; }
.avatar.has { border-style: solid; border-color: #fff; box-shadow: 0 0 0 1.5px var(--line); }
.avatar.sm { width: 40px; height: 40px; font-size: .8rem; }
.avatar.md { width: 56px; height: 56px; font-size: 1rem; }
.avatar.lg { width: 76px; height: 76px; font-size: 1.3rem; }
.avatar-wrap { position: relative; display: inline-block; flex: none; }
.avatar-wrap .cam { position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: .8rem; padding: 0; line-height: 1; }
.bars .bar-row { display: grid; grid-template-columns: 56px 1fr 44px; gap: 10px; align-items: center; margin: 9px 0; font-size: .88rem; }
.bars .track { height: 14px; background: var(--line-soft); border-radius: 5px; overflow: hidden; }
.bars .track i { display: block; height: 100%; background: #b8bfcf; border-radius: 5px; }
.bars .bar-row.hl .track i { background: var(--accent); }
.bars .bar-row b { text-align: right; }
.comment { background: var(--soft); border-radius: 8px; padding: 8px 11px; font-size: .88rem; margin-top: 6px; }
.comment b { font-weight: 700; }

/* ---------- auth pages ---------- */
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); }
.auth-wrap { width: 100%; max-width: 430px; }
.auth-card { padding: 26px 26px 22px; }
.auth-card .logo { width: 120px; height: auto; display: block; margin: 0 auto 12px; }
.brand-logo { width: 100px; height: auto; display: block; margin-bottom: 8px; }
.auth-card h1 { text-align: center; font-size: 1.35rem; }
.auth-card .school { text-align: center; color: var(--muted); font-size: .9rem; margin: 2px 0 16px; }
.demo-box { margin-top: 14px; font-size: .82rem; }
.demo-box summary { cursor: pointer; color: var(--muted); }
.demo-box table { width: 100%; margin-top: 8px; border-collapse: collapse; }
.demo-box td { padding: 4px 6px; border-bottom: 1px solid var(--line-soft); }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { background: #fff; border-right: 1.5px solid var(--line-soft); padding: 18px 12px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.side .brand { font-weight: 800; font-size: 1.1rem; padding: 0 10px 14px; }
.side nav { display: flex; flex-direction: column; gap: 3px; }
.side nav a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: .95rem; }
.side nav a:hover { background: var(--soft); }
.side nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.side .me { margin-top: auto; padding: 12px 10px 0; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line-soft); }
.side .me b { display: block; color: var(--text); }
.main { padding: 26px 30px 60px; max-width: 1060px; width: 100%; }
.hero { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.hero h1 { font-size: 1.5rem; }

/* ---------- misc widgets ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(20, 25, 40, .5); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; overflow: auto; z-index: 50; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal.wide { max-width: 760px; }
.modal h2 { margin-bottom: 4px; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--dark); color: #fff; padding: 10px 16px; border-radius: 9px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; }
.toast.err { background: var(--red); }
.chart svg { width: 100%; height: auto; display: block; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.demo-bar { position: fixed; right: 12px; bottom: 12px; z-index: 40; }
.demo-bar button { background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .78rem; color: var(--muted); cursor: pointer; }
.perm-grid th, .perm-grid td { padding: 9px 8px; font-size: .88rem; }
.perm-grid td.sec { background: var(--soft); font-weight: 700; }
.perm-grid input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.perm-lock { border: 0; background: none; cursor: pointer; font-size: .9rem; }
.preview { background: var(--soft); border-radius: var(--radius); padding: 16px; }
.preview .kv { display: flex; justify-content: space-between; padding: 8px 0; }
.letter-text { white-space: pre-wrap; font-family: Georgia, "Times New Roman", serif; line-height: 1.6; }
.mobile-top { display: none; }

#print-root { display: none; }
@media print {
  body.printing > *:not(#print-root) { display: none !important; }
  body.printing #print-root { display: block !important; padding: 0; color: #000; background: #fff; }
  body { background: #fff; }
  #print-root h1 { font-size: 20pt; margin-bottom: 4pt; }
  #print-root h2 { font-size: 13pt; margin: 14pt 0 4pt; }
  #print-root table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  #print-root th, #print-root td { border-bottom: 1px solid #bbb; padding: 4pt 6pt; text-align: left; }
}

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side, .main { min-width: 0; }
  .side .me { position: static; padding: 2px 4px; justify-content: space-between; }
  .side .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 52px; margin: 0; }
  .side { position: static; height: auto; flex-direction: column; align-items: stretch; padding: 10px 12px 6px; border-right: 0; border-bottom: 1.5px solid var(--line-soft); gap: 4px; }
  .side .brand { padding: 0 4px; display: inline-block; }
  .side nav { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .side nav a { white-space: nowrap; padding: 8px 12px; }
  .side .me { margin: 0; border: 0; display: flex; gap: 10px; align-items: center; }
  .side .me b { display: inline; }
  .demo-bar { bottom: 6px; right: 6px; }
  .main { padding: 18px 14px 60px; }
  .g2, .g3, .g4, .g-side { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  table.tbl.responsive thead { display: none; }
  .perm-wrap { overflow-x: auto; }
}
@media (max-width: 520px) {
  .stats-row { grid-template-columns: 1fr; }
  .auth-card { padding: 20px 16px; }
}

/* ---------- landing page ---------- */
.lp-top { background: #fff; border-bottom: 1.5px solid var(--line-soft); }
.lp-wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }
.lp-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 22px; gap: 12px; }
.lp-nav img { height: 76px; width: auto; display: block; }
.lp-hero { background: var(--dark); color: #fff; padding: 64px 0 70px; position: relative; overflow: hidden; }
.lp-hero::after { content: ""; position: absolute; right: -90px; bottom: -120px; width: 380px; height: 380px; border-radius: 50%; background: var(--accent); opacity: .9; }
.lp-hero .lp-wrap { position: relative; z-index: 1; }
.lp-hero h1 { font-size: 2.6rem; line-height: 1.1; max-width: 640px; letter-spacing: -.02em; }
.lp-hero p { margin-top: 16px; font-size: 1.1rem; max-width: 560px; color: #d9d9d9; }
.lp-hero .row { margin-top: 26px; }
.lp-hero .btn { border-color: #fff; }
.lp-hero .btn.light { background: #fff; color: var(--dark); }
.lp-hero .btn.ghost { background: transparent; color: #fff; }
.lp-hero .btn.ghost:hover { background: rgba(255,255,255,.12); }
.lp-sec { padding: 54px 0 10px; }
.lp-sec h2 { font-size: 1.6rem; letter-spacing: -.01em; }
.lp-sec .lead { color: var(--muted); margin-top: 6px; max-width: 620px; }
.role-card { background: #fff; border: 1.5px solid var(--line-soft); border-top: 4px solid var(--accent); border-radius: var(--radius); padding: 18px 18px 16px; }
.role-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
.role-card p { color: var(--muted); font-size: .94rem; }
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.steps > div { background: #fff; border: 1.5px solid var(--line-soft); border-radius: var(--radius); padding: 16px 18px; }
.steps > div::before { counter-increment: s; content: counter(s); display: inline-flex; width: 30px; height: 30px; border-radius: 50%; background: var(--dark); color: #fff; align-items: center; justify-content: center; font-weight: 700; margin: 0 10px 8px 0; vertical-align: middle; }
.lp-foot { margin-top: 56px; background: var(--dark); color: #cfcfcf; padding: 26px 0; font-size: .9rem; }
.lp-foot a { color: #fff; }
@media (max-width: 860px) { .lp-hero::after { width: 160px; height: 160px; right: -50px; bottom: -70px; } .steps { grid-template-columns: 1fr; } .lp-hero h1 { font-size: 2rem; } .lp-hero { padding: 40px 0 60px; } .lp-nav img { height: 56px; } }

  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="print-root"></div>
  <div class="demo-bar"><button data-act="resetDemo" title="Put all sample data back how it started">Reset demo data</button></div>

  <script>
/* ===== js/config.js ===== */
/* Settings the group can change in one place. */
const CONFIG = {
  schoolName: 'Africa University',

function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

/* Jordan keeps the exact grades shown in the wireframe; others get slightly shifted versions. */
function makeGrades(studentId, yearsDone, exact) {
  const out = [];
  SEM_TEMPLATES.filter(t => t.y <= yearsDone).forEach(t => {
    out.push({
      year: t.y, sem: t.s,
      // Certified in Dec (semester 1) or Jun (semester 2) of the right calendar year for this student's cohort.
      certified: `${t.s === 1 ? 'Dec' : 'Jun'} ${(t.s === 1 ? 2025 : 2026) - (yearsDone - t.y)}`,
      courses: t.courses.map(([code, title, credits, grade]) => {
        if (!exact) {
          const shift = (hashStr(studentId + code) % 3) - 1; // -1, 0 or +1 step
          const i = Math.min(GRADE_ORDER.length - 1, Math.max(0, GRADE_ORDER.indexOf(grade) + shift));
          grade = GRADE_ORDER[i];
        }
        return { code, title, credits, grade };
      }),
    });
  });
  return out;
}

/* Store: the single place that holds app data (in localStorage) and the signed-in session.
   Swap this file for real API calls when a back end exists. */

const Store = {
  state: null,

  load() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.v === 2) { this.state = s; return; }
      }
    } catch (e) { /* fall through to seed */ }
    this.state = buildSeed();
    this.save();
  },
  save() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(this.state)); }
    catch (e) { if (window.UI) UI.toast('Could not save. The browser storage is full or blocked.', true); }
  },
  reset() {
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
    Session.clear();
    this.state = buildSeed();
    this.save();
  },
  id(prefix) { this.state.seq += 1; return `${prefix}${this.state.seq}`; },

  user(id) { return this.state.users.find(u => u.id === id) || null; },
  users(role) { return this.state.users.filter(u => !role || u.role === role); },
  students() { return this.state.users.filter(u => u.role === 'student'); },
  byEmailOrId(text) {
    const t = (text || '').trim().toLowerCase();
    return this.state.users.find(u => u.email.toLowerCase() === t || (u.schoolId && u.schoolId.toLowerCase() === t)) || null;
  },
  log(text, by, extra = {}) {
    this.state.audit.unshift({ id: this.id('g'), text, ts: new Date().toISOString(), by: by || 'System', ...extra });
  },
  event(userId, kind, text, ref) {
    this.state.events.unshift({ id: this.id('e'), userId, kind, text, ts: new Date().toISOString(), ref });
  },
};

/* ---------- session ---------- */
const Session = {
  get() {
    try {
      const raw = sessionStorage.getItem(CONFIG.sessionKey) || localStorage.getItem(CONFIG.sessionKey);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  set(userId, remember) {
    // Permissions are copied at sign-in: "changes apply the next time people sign in".
    const data = JSON.stringify({ userId, perms: JSON.parse(JSON.stringify(Store.state.permissions)) });
    try {
      sessionStorage.removeItem(CONFIG.sessionKey); localStorage.removeItem(CONFIG.sessionKey);
      (remember ? localStorage : sessionStorage).setItem(CONFIG.sessionKey, data);
    } catch (e) {}
  },
  clear() { try { sessionStorage.removeItem(CONFIG.sessionKey); localStorage.removeItem(CONFIG.sessionKey); } catch (e) {} },
  user() {
    const s = this.get();
    if (!s) return null;
    const u = Store.user(s.userId);
    if (!u || !u.active) { this.clear(); return null; }
    return u;
  },
  /* Does the signed-in person's role have this permission (as it was when they signed in)? */
  can(key) {
    const u = this.user(), s = this.get();
    if (!u || !s) return false;
    const role = u.role === 'staff' ? u.staffRole : u.role;
    const row = (s.perms || {})[key];
    if (!row) return true;
    return row[role] === true;
  },
};

/* ---------- grade maths ---------- */
const Calc = {
  semGpa(sem) {
    const cr = sem.courses.reduce((a, c) => a + c.credits, 0);
    if (!cr) return 0;
    return sem.courses.reduce((a, c) => a + GRADE_POINTS[c.grade] * c.credits, 0) / cr;
  },
  semCredits(sem) { return sem.courses.reduce((a, c) => a + c.credits, 0); },
  sems(userId) { return (Store.state.grades[userId] || []).slice().sort((a, b) => a.year - b.year || a.sem - b.sem); },
  overall(userId) {
    const sems = this.sems(userId);
    const cr = sems.reduce((a, s) => a + this.semCredits(s), 0);
    if (!cr) return null;
    const pts = sems.reduce((a, s) => a + s.courses.reduce((b, c) => b + GRADE_POINTS[c.grade] * c.credits, 0), 0);
    return pts / cr;
  },
  credits(userId) { return this.sems(userId).reduce((a, s) => a + this.semCredits(s), 0); },
  latest(userId) { const s = this.sems(userId); return s.length ? s[s.length - 1] : null; },
  previous(userId) { const s = this.sems(userId); return s.length > 1 ? s[s.length - 2] : null; },
  fmt(n) { return n == null ? '–' : n.toFixed(2); },
  points(grade) { return GRADE_POINTS[grade].toFixed(1); },
};

/* ---------- queries used by several screens ---------- */
const Q = {
  acts(userId) { return Store.state.activities.filter(a => a.userId === userId); },
  projects(userId) { return Store.state.projects.filter(p => p.userId === userId); },
  letters(studentId) { return Store.state.letters.filter(l => l.studentId === studentId); },
  attachment(studentId) { return Store.state.attachments.find(a => a.studentId === studentId) || null; },
  attachmentWeek(att) {
    const days = Math.floor((Date.now() - new Date(att.start + 'T00:00:00').getTime()) / 86400000);
    return Math.min(att.weeks, Math.max(1, Math.floor(days / 7) + 1));
  },
  attachmentActive(att) { return new Date(att.end + 'T23:59:59').getTime() >= Date.now(); },
  daysLeft(att) { return Math.ceil((new Date(att.end + 'T23:59:59').getTime() - Date.now()) / 86400000); },
  /* Which students can this staff member open? */
  staffStudents(staff) {
    if (Session.can('view_all')) return Store.students();
    return (staff.teaches || []).map(id => Store.user(id)).filter(u => u && u.active);
  },
  /* Which students can this supervisor open? Only linked students, only while the attachment runs. */
  supervisorStudents(sup) {
    return Store.state.attachments.filter(a => a.supervisorId === sup.id && Q.attachmentActive(a))
      .map(a => ({ att: a, student: Store.user(a.studentId) })).filter(x => x.student && x.student.active);
  },
  canSeeStudent(viewer, studentId) {
    if (!viewer) return false;
    if (viewer.role === 'student') return viewer.id === studentId;
    if (viewer.role === 'admin') return true;
    if (viewer.role === 'staff') return Q.staffStudents(viewer).some(s => s.id === studentId);
    if (viewer.role === 'supervisor') return Q.supervisorStudents(viewer).some(x => x.student.id === studentId);
    return false;
  },
  pendingEntries(staff) {
    const ids = new Set(Q.staffStudents(staff).map(s => s.id));
    return Store.state.activities.filter(a => ids.has(a.userId) && a.status === 'waiting').sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  },
  staffLetters(staffId, status) { return Store.state.letters.filter(l => l.staffId === staffId && (!status || l.status === status)); },
  portfolioComplete(userId) {
    const acts = Q.acts(userId);
    return ['achievement', 'leadership', 'extra'].every(t => acts.some(a => a.type === t)) && Q.projects(userId).length > 0;
  },
};

/* ===== js/ui.js ===== */
/* UI: small helpers shared by every screen (escaping, dates, modals, toasts, forms, printing, router). */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const UI = {
  actions: {},     // data-act="name" click handlers
  changes: {},     // data-change="name" change handlers
  inputs: {},      // data-input="name" input handlers
  submits: {},     // form[data-submit="name"] handlers
  vs: {},          // per-screen view state (selected tab, open panels...)
  drafts: {},      // form values that survive a re-render
  routes: [],

  on(name, fn) { this.actions[name] = fn; },
  onChange(name, fn) { this.changes[name] = fn; },
  onInput(name, fn) { this.inputs[name] = fn; },
  onSubmit(name, fn) { this.submits[name] = fn; },
  state(key, defaults) { if (!this.vs[key]) this.vs[key] = Object.assign({}, defaults); return this.vs[key]; },

  /* ---------- formatting ---------- */
  fmtDate(iso) { if (!iso) return ''; const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); },
  fmtDateLong(iso) { if (!iso) return ''; const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); },
  fmtWhen(iso) {
    const d = new Date(iso), now = new Date();
    const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
    if (days <= 0) return 'Today, ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (days === 1) return 'Yesterday';
    return UI.fmtDate(iso);
  },
  daysUntil(isoDate) { return Math.ceil((new Date(isoDate + 'T23:59:59').getTime() - Date.now()) / 86400000); },
  dueLabel(isoDate) {
    const n = UI.daysUntil(isoDate);
    if (n < 0) return `<span class="bad">⏱ ${-n} day${n === -1 ? '' : 's'} overdue</span>`;
    if (n <= 14) return `<span class="bad">⏱ Due in ${n} day${n === 1 ? '' : 's'}</span>`;
    return `<span class="muted">Due ${UI.fmtDate(isoDate)}</span>`;
  },
  initials(name) { return name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); },
  plural(n, one, many) { return `${n} ${n === 1 ? one : (many || one + 's')}`; },
  nl2br(s) { return esc(s).replace(/\n/g, '<br>'); },
  today() { return new Date().toISOString().slice(0, 10); },

  avatar(u, size = 'sm') {
    if (u && u.photo) return `<span class="avatar has ${size}" style="background-image:url('${u.photo}')" role="img" aria-label="Photo of ${esc(u.name)}"></span>`;
    return `<span class="avatar ${size}" aria-hidden="true">${u ? esc(UI.initials(u.name)) : ''}</span>`;
  },
  /* Avatar with a camera button for the signed-in person's own photo */
  avatarEditable(u) {
    return `<span class="avatar-wrap">${UI.avatar(u, 'lg')}<button class="cam" data-act="photo" title="Change photo" aria-label="Change profile photo">📷</button></span>`;
  },
  empty(title, text) { return `<div class="empty"><b>${esc(title)}</b>${esc(text)}</div>`; },
  crumbs(parts) {
    return `<div class="crumbs">${parts.map(p => p.href ? `<a href="${p.href}">${esc(p.label)}</a>` : esc(p.label)).join(' › ')}</div>`;
  },
  ratingRow(label, name, value, readonly) {
    const btns = [1, 2, 3, 4, 5].map(n => `<button type="button" class="${value === n ? 'on' : ''}" ${readonly ? 'tabindex="-1"' : `data-act="rate" data-name="${name}" data-val="${n}"`} aria-label="${label} ${n} out of 5" aria-pressed="${value === n}">${n}</button>`).join('');
    return `<div class="row between" style="margin:9px 0"><span>${esc(label)}</span><div class="rating ${readonly ? 'readonly' : ''}" data-rating="${name}">${btns}</div></div>`;
  },

  /* ---------- toast & modal ---------- */
  toast(msg, isErr) {
    let box = $('#toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), isErr ? 5200 : 3400);
  },
  modal(html, opts = {}) {
    UI.closeModal();
    const back = document.createElement('div');
    back.className = 'modal-back'; back.id = 'modal-back';
    back.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('mousedown', e => { if (e.target === back) UI.closeModal(); });
    $('#modal-root').appendChild(back);
    const first = $('input:not([type=hidden]),textarea,select', back);
    if (first && !opts.noFocus) first.focus();
  },
  closeModal() { const m = $('#modal-back'); if (m) m.remove(); },
  confirm(title, text, okLabel, onOk, danger) {
    UI.modal(`<h2>${esc(title)}</h2><p class="muted" style="margin:6px 0 16px">${esc(text)}</p>
      <div class="row"><button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-ok">${esc(okLabel)}</button><button class="btn" data-act="closeModal">Cancel</button></div>`, { noFocus: true });
    $('#confirm-ok').onclick = () => { UI.closeModal(); onOk(); };
  },

  /* ---------- forms ---------- */
  formData(form) {
    const out = {};
    $$('[name]', form).forEach(el => {
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else if (el.type === 'file') out[el.name] = el.files && el.files[0] ? el.files[0] : null;
      else out[el.name] = el.value;
    });
    return out;
  },
  /* Shows an error right next to each field, and clears old ones. errs = {fieldName: 'message'} */
  showErrors(form, errs) {
    $$('.err-msg[data-auto]', form).forEach(e => e.remove());
    $$('.input.err', form).forEach(e => e.classList.remove('err'));
    let first = null;
    Object.keys(errs).forEach(name => {
      const el = form.elements[name] || $(`[name="${name}"]`, form);
      const msg = document.createElement('div');
      msg.className = 'err-msg'; msg.dataset.auto = '1'; msg.setAttribute('role', 'alert'); msg.textContent = errs[name];
      if (el) {
        el.classList && el.classList.add('err');
        const anchor = el.closest('.pw-wrap') || el.closest('.phone-row') || el;
        anchor.insertAdjacentElement('afterend', msg);
        if (!first) first = el;
      } else form.insertAdjacentElement('afterbegin', msg);
    });
    if (first && first.focus) first.focus();
    return Object.keys(errs).length === 0;
  },
  clearDrafts(formId) { delete UI.drafts[formId]; },
  saveDraft(el) {
    const form = el.closest('form[id]');
    if (!form || !el.name || el.type === 'password' || el.type === 'file') return;
    (UI.drafts[form.id] = UI.drafts[form.id] || {})[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  },
  restoreDrafts(root) {
    $$('form[id]', root).forEach(form => {
      const d = UI.drafts[form.id]; if (!d) return;
      Object.keys(d).forEach(name => {
        const el = form.elements[name]; if (!el || el.length) return;
        if (el.type === 'checkbox') el.checked = d[name]; else el.value = d[name];
      });
      $$('[data-rating]', form).forEach(box => {
        const hid = form.elements[box.dataset.rating]; if (!hid) return;
        $$('button', box).forEach(b => { const on = Number(b.dataset.val) === Number(hid.value); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      });
    });
  },

  /* ---------- download, print ---------- */
  download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  /* "Download as PDF": opens the browser's print dialog showing only this content; choose "Save as PDF". */
  print(title, html) {
    const r = $('#print-root');
    r.innerHTML = `<h1>${esc(title)}</h1><p class="muted small">${esc(CONFIG.schoolName)} · printed ${UI.fmtDateLong(new Date().toISOString())}</p>${html}`;
    document.body.classList.add('printing');
    UI.toast('In the print window, choose "Save as PDF".');
    setTimeout(() => { try { window.print(); } finally { document.body.classList.remove('printing'); r.innerHTML = ''; } }, 300);
  },
  csv(rows) {
    return rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  },
  parseCsv(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  },

  /* ---------- photo ---------- */
  pickPhoto() {
    const user = Session.user(); if (!user) return;
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = () => {
      const f = input.files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const size = 240, c = document.createElement('canvas'); c.width = c.height = size;
        const s = Math.min(img.width, img.height), ctx = c.getContext('2d');
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        user.photo = c.toDataURL('image/jpeg', 0.8); URL.revokeObjectURL(url);
        Store.save(); UI.toast('Photo updated.'); UI.render();
      };
      img.onerror = () => UI.toast('That file is not a picture we can read.', true);
      img.src = url;
    };
    input.click();
  },
  /* Read a small attachment (certificate). Keeps the data only when it is small enough for browser storage. */
  readAttachment(file) {
    return new Promise(resolve => {
      if (!file) return resolve(null);
      if (file.size > 250 * 1024) return resolve({ name: file.name, data: null, note: 'too large to keep in the prototype' });
      const r = new FileReader();
      r.onload = () => resolve({ name: file.name, data: r.result });
      r.onerror = () => resolve({ name: file.name, data: null });
      r.readAsDataURL(file);
    });
  },

  /* ---------- router + render ---------- */
  route() {
    const raw = (location.hash || '#/').slice(1);
    const [path, qs] = raw.split('?');
    const query = {}; (qs || '').split('&').filter(Boolean).forEach(p => { const [k, v] = p.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { path: path || '/', query };
  },
  go(path) { if (location.hash === '#' + path) UI.render(); else location.hash = path; },
  lastPath: null,
  afterFns: [],
  after(fn) { this.afterFns.push(fn); },
  render() {
    const app = $('#app');
    const r = UI.route();
    const scroll = r.path === UI.lastPath ? window.scrollY : 0;
    const ae = document.activeElement;
    const keep = ae && ae.dataset && ae.dataset.keep ? { key: ae.dataset.keep, pos: ae.selectionStart } : null;
    let html = '';
    try { html = Router.resolve(r); }
    catch (err) { console.error(err); html = `<div class="auth-page"><div class="card"><h2>Something went wrong</h2><p class="muted">${esc(err.message)}</p><p style="margin-top:12px"><a href="#/">Back to start</a></p></div></div>`; }
    app.innerHTML = html;
    UI.restoreDrafts(app);
    UI.lastPath = r.path;
    window.scrollTo(0, scroll);
    if (keep) { const el = $(`[data-keep="${keep.key}"]`, app); if (el) { el.focus(); try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
    document.title = Router.title || 'Student Portfolio System';
    const fns = UI.afterFns; UI.afterFns = []; fns.forEach(fn => { try { fn(app); } catch (e) { console.error(e); } });
  },
};

const Router = {
  title: '',
  table: [],
  add(pattern, roles, fn, title) { this.table.push({ re: new RegExp('^' + pattern.replace(/:([a-z]+)/g, '([^/]+)') + '$'), roles, fn, title }); },
  resolve(r) {
    const user = Session.user();
    for (const t of this.table) {
      const m = r.path.match(t.re);
      if (!m) continue;
      this.title = (t.title || 'Student Portfolio System') + ' · ' + CONFIG.schoolName;
      if (t.roles) {
        if (!user) { sessionStorage.setItem('spp.after', location.hash); return Views.auth.login({ notice: 'Please sign in to continue.' }); }
        if (!t.roles.includes(user.role)) { UI.toast('That page is for a different role.', true); return Views.shell.redirect(Views.shell.home(user)); }
      }
      return t.fn({ user, params: m.slice(1).map(decodeURIComponent), query: r.query });
    }
    if (user) return Views.shell.redirect(Views.shell.home(user));
    return Views.auth.landing();
  },
};

/* ---------- global event delegation ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = UI.actions[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.dataset.native) e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  UI.saveDraft(el);
  const name = el.dataset && el.dataset.change; if (name && UI.changes[name]) UI.changes[name](el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  UI.saveDraft(el);
  const name = el.dataset && el.dataset.input; if (name && UI.inputs[name]) UI.inputs[name](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]');
  if (!f) return;
  e.preventDefault();
  const fn = UI.submits[f.dataset.submit]; if (fn) fn(f, e);
});

UI.on('closeModal', () => UI.closeModal());
UI.on('photo', () => UI.pickPhoto());
UI.on('goto', el => UI.go(el.dataset.to));
UI.on('rate', el => {
  // Rating buttons live inside forms; the value is kept in a hidden input named after the rating.
  const form = el.closest('form'); const name = el.dataset.name; const val = Number(el.dataset.val);
  const hidden = form.elements[name]; const same = Number(hidden.value) === val;
  hidden.value = same ? '' : val;
  $$(`[data-rating="${name}"] button`, form).forEach(b => { const on = !same && Number(b.dataset.val) === val; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  UI.saveDraft(hidden);
});
UI.on('sampleLink', el => UI.toast('Sample link. In the real system this opens the student\'s work.'));

/* A link that goes to the student's real URL, or shows a note for the made-up sample links */
UI.link = (url, label, cls = 'btn small') => {
  if (!url) return '';

  return sample ? `<a class="${cls}" href="#" data-act="sampleLink">${esc(label)}</a>` : `<a class="${cls}" href="${esc(full)}" target="_blank" rel="noopener">${esc(label)}</a>`;
};

const Auth = {
  passwordScore(pw) {
    let s = 0;
    if (pw.length >= 8) s++;
    if (/\d/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    if (pw.length >= 12 || (/[a-z]/.test(pw) && /[A-Z]/.test(pw))) s++;
    return pw ? Math.max(1, s) : 0;
  },
  passwordProblem(pw) {
    if (!pw) return 'Create a password.';
    if (pw.length < 8) return 'Use at least 8 characters.';
    if (!/\d/.test(pw)) return 'Add at least one number.';
    if (!/[^A-Za-z0-9]/.test(pw)) return 'Add at least one symbol, such as ! or @.';
    return '';
  },
};
UI.onInput('pwStrength', el => {

  bar.className = 'strength' + (el.value ? ' s' + Auth.passwordScore(el.value) : '');
});

  d.schoolId = d.schoolId.trim(); d.email = d.email.trim();
  if (!/^\d{6}$/.test(d.schoolId)) errs.schoolId = 'Enter your 6-digit school ID, for example 250493.';
  if (!/^\S+@\S+\.\S+$/.test(d.email)) errs.email = 'Enter a valid school email.';
  const digits = d.phone.replace(/[\s-]/g, '');
  if (!/^\d{7,10}$/.test(digits)) errs.phone = 'Enter your phone number without the country code, for example 77 123 4567.';
  const pe = Auth.passwordProblem(d.password); if (pe) errs.password = pe;
  else if (d.password !== d.confirm) errs.confirm = 'The two passwords do not match.';
  if (!d.agree) errs.agree = 'Please agree to the privacy policy to continue.';

  if (!errs.schoolId) {
    const rec = S.registry.find(r => r.schoolId === d.schoolId);
    const existingUser = S.users.find(u => u.schoolId === d.schoolId);
    const pending = S.signups.find(s => s.schoolId === d.schoolId);
    if (existingUser) errs.schoolId = 'An account already exists for this school ID. Sign in instead.';
    else if (pending && pending.status !== 'correction') errs.schoolId = 'This school ID has already signed up and is waiting for approval.';
    else if (!rec) errs.schoolId = `We could not find this school ID in school records. Check it, or contact the registry office (${CONFIG.registryEmail}).`;
  }
  if (Object.keys(errs).length) return UI.showErrors(form, errs);

  const rec = S.registry.find(r => r.schoolId === d.schoolId);
  const entry = { schoolId: d.schoolId, name: rec.name, email: d.email, phone: `${d.cc} ${d.phone}`, password: d.password };
  Auth.verify(entry, rec);
});

/* Two-step verification: a code to the school email, then a code to the phone. (Prototype: the code is shown on screen.) */
Auth.verify = (entry, rec) => {
  const CODE = '482913';
  const step = (which) => {
    const where = which === 'email' ? entry.email : entry.phone;
    UI.modal(`<h2>Verify your ${which}</h2>
      <p class="muted small" style="margin:4px 0 12px">We sent a 6-digit code to <b>${esc(where)}</b>.</p>
      <div class="banner info small">Prototype only: no real message is sent. Your code is <b>${CODE}</b>.</div>
      <form id="verify-form" data-submit="verify" novalidate style="margin-top:12px">
        <label class="field" for="vf-code">6-digit code</label><input class="input" id="vf-code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <div class="row" style="margin-top:14px"><button class="btn primary">Verify ${which}</button><button type="button" class="btn" data-act="closeModal">Cancel</button></div>
      </form>`);
    UI.submits.verify = f => {
      if (f.elements.code.value.trim() !== CODE) return UI.showErrors(f, { code: 'That code is not right. Check it and try again.' });
      if (which === 'email') return step('phone');
      UI.closeModal();
      const match = rec.email.toLowerCase() === entry.email.toLowerCase();
      const S = Store.state;
      S.signups = S.signups.filter(s => s.schoolId !== entry.schoolId);
      S.signups.unshift({ id: Store.id('su'), ...entry, status: match ? 'match' : 'mismatch', registryEmail: rec.email, note: '', ts: new Date().toISOString() });
      Store.log(`${entry.name} signed up and is waiting for approval`, 'System'); Store.save();
      UI.clearDrafts('signup-form');
      UI.state('signup').done = { name: entry.name, status: match ? 'match' : 'mismatch' };
      UI.render();
    };
  };
  step('email');
};

  const waiting = Q.acts(user.id).filter(a => a.status === 'waiting').length;
  const needEvidence = Q.acts(user.id).filter(a => a.status === 'evidence').length;
  const bits = [];
  if (readyLetters) bits.push(`${readyLetters === 1 ? 'a letter is' : readyLetters + ' letters are'} ready to download`);
  if (needEvidence) bits.push(`${needEvidence === 1 ? 'one activity needs' : needEvidence + ' activities need'} evidence from you`);
  if (waiting) bits.push(`${waiting === 1 ? 'one activity is' : waiting + ' activities are'} waiting for a teacher to check ${waiting === 1 ? 'it' : 'them'}`);
  const count = readyLetters + (needEvidence ? 1 : 0) + (waiting ? 1 : 0);
  const banner = bits.length ? `<div class="banner warn" style="margin-bottom:14px">● ${count === 1 ? 'One thing needs' : count + ' things need'} you: ${bits.join(', and ')}.</div>` : '';

  const hs = UI.state('home', { allSems: false });
  const delta = latest && prev ? Calc.semGpa(latest) - Calc.semGpa(prev) : null;
  const deltaTxt = delta == null ? '' : Math.abs(delta) < 0.005 ? `Same as last semester (${Calc.fmt(Calc.semGpa(prev))})` : delta > 0 ? `↑ Up from ${Calc.fmt(Calc.semGpa(prev))} last semester` : `↓ Down from ${Calc.fmt(Calc.semGpa(prev))} last semester`;

  // recent updates
  const seenLetters = new Set();
  const events = S.events.filter(e => e.userId === user.id).sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 6);
  const evRows = events.map(e => {
    const icon = { verified: '✓', waiting: '●', letter: '↓', comment: '💬', assessment: '★', evidence: '▲', note: '✎' }[e.kind] || '•';
    const cls = { verified: 'ok', waiting: 'wait', letter: 'info', comment: 'info', assessment: 'info', evidence: 'bad', note: 'info' }[e.kind] || '';
    let right = { verified: '<span class="status ok">Verified</span>', waiting: '<span class="status wait">Waiting</span>', evidence: '<span class="status bad">Evidence needed</span>' }[e.kind] || '';
    if (e.kind === 'letter') {
      const l = S.letters.find(x => x.id === e.ref);
      if (l && (l.status === 'ready' || l.status === 'changes') && !seenLetters.has(l.id)) {
        seenLetters.add(l.id);
        right = `<span class="row" style="gap:6px"><button class="btn small" data-act="downloadLetter" data-id="${l.id}">Download</button>${l.changesUsed < CONFIG.maxLetterChanges && l.status === 'ready' ? `<button class="btn small" data-act="askChanges" data-id="${l.id}">Ask for changes</button>` : ''}</span>`;
      }
    }
    return `<div class="item"><span class="status ${cls}" aria-hidden="true" style="width:18px">${icon}</span><div class="grow">${esc(e.text)}<div class="xs muted">${UI.fmtWhen(e.ts)}</div></div><div>${right}</div></div>`;
  }).join('');

  // feedback from teachers and supervisor
  const fb = [];
  S.assessments.filter(a => a.studentId === user.id).forEach(a => fb.push({ ts: a.ts, who: Names.staff(Store.user(a.staffId)), ratings: [['Leadership', a.leadership], ['Teamwork', a.teamwork], ['Communication', a.communication]].filter(r => r[1]), text: a.feedback }));
  const att = Q.attachment(user.id);
  if (att) att.notes.forEach(n => fb.push({ ts: n.ts, who: `${Store.user(att.supervisorId).name} (${att.company}), week ${n.week}`, ratings: [['Punctuality', n.ratings.punctuality], ['Quality of work', n.ratings.quality], ['Teamwork', n.ratings.teamwork]].filter(r => r[1]), text: n.text }));
  fb.sort((a, b) => b.ts.localeCompare(a.ts));
  const fbHtml = fb.length ? `<div class="card"><h3>Feedback about you</h3><div class="list" style="margin-top:8px">${fb.slice(0, 3).map(f => `<div class="item" style="display:block"><div class="bold small">${esc(f.who)} <span class="muted" style="font-weight:400">· ${UI.fmtDate(f.ts)}</span></div>${f.ratings.length ? `<div class="small muted">${f.ratings.map(r => `${esc(r[0])} ${r[1]}/5`).join(' · ')}</div>` : ''}${f.text ? `<div class="small" style="margin-top:3px">${esc(f.text)}</div>` : ''}</div>`).join('')}</div></div>` : '';

  return wrapS(user, '', `
    <div class="hero">${UI.avatarEditable(user)}<div><h1>Hi, ${esc(user.name)}</h1><p class="muted">Year ${user.year} · ${esc(user.programme)}</p></div></div>
    ${banner}
    <h2 style="margin-bottom:8px">What would you like to do?</h2>
    <div class="grid g3" style="margin-bottom:14px">
      <a class="btn block" href="#/student/grades">See my grades</a>
      ${Session.can('add_activities') ? `<a class="btn block" href="#/student/activities?add=1">Add an activity</a>` : '<span></span>'}
      <a class="btn primary block" href="#/student/letters">Ask for a letter</a>
    </div>
    <div class="grid g3 stats-row" style="margin-bottom:14px">
      <div class="stat"><div class="lbl">Your GPA this semester</div><div class="num">${latest ? Calc.fmt(Calc.semGpa(latest)) : '–'}</div><div class="sub ${delta != null && delta < 0 ? 'warn' : 'good'}">${latest ? deltaTxt || 'First certified semester' : 'Not certified yet'}</div></div>
      <div class="stat"><div class="lbl">Your overall GPA</div><div class="num">${Calc.fmt(overall)}</div><div class="sub good">${overall != null ? '✓ Official, certified by the school' : 'Appears once the registry certifies your grades'}</div></div>
      <div class="stat"><div class="lbl">Your progress to graduation</div><div class="num">${pct}%</div><div class="progress" style="margin:6px 0" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="sub muted">${credits} of 120 credits done</div></div>
    </div>
    <div class="card chart" style="margin-bottom:14px"><h3>How your GPA has changed</h3>
      <p class="muted small">Each dot is one semester. Your best so far is this one.</p>
      ${SV.gpaChart(sems)}
      <button class="btn small" data-act="toggleSems" style="margin-top:6px">${hs.allSems ? 'Hide semesters' : 'See every semester'}</button>
      ${hs.allSems ? `<table class="tbl" style="margin-top:10px"><tbody>${sems.map(s => `<tr><td>Year ${s.year}, Semester ${s.sem}</td><td class="right bold">${Calc.fmt(Calc.semGpa(s))}</td></tr>`).join('')}</tbody></table>` : ''}
    </div>
    <div class="card" style="margin-bottom:14px"><h3>Recent updates</h3><div class="list" style="margin-top:8px">${evRows || '<p class="muted small">Nothing yet. Updates about your entries and letters will show here.</p>'}</div></div>
    ${SV.changePanel(user)}
    ${fbHtml ? `<div style="margin-top:14px">${fbHtml}</div>` : ''}
  `);
};

SV.gpaChart = (sems) => {
  if (!sems.length) return UI.empty('No grades yet', 'Your GPA graph appears here once the registry office has certified your first semester.');
  const W = 640, H = 210, L = 44, R = 20, T = 22, B = 36;
  const vals = sems.map(Calc.semGpa);
  const yMin = Math.min(3.0, Math.floor(Math.min(...vals) * 2) / 2), yMax = 4.0;
  const x = i => sems.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (sems.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin));
  const grid = []; for (let g = yMin; g <= yMax + 0.001; g += 0.5) grid.push(g);
  const best = Math.max(...vals);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const years = [...new Set(sems.map(s => s.year))];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph of GPA by semester. Latest ${Calc.fmt(vals[vals.length - 1])}.">
    ${grid.map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#e3e6ec"/><text x="${L - 8}" y="${y(g) + 4}" text-anchor="end" font-size="12" fill="#5b6475">${g.toFixed(1)}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="#c8191f" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v, i) => { const last = i === vals.length - 1; return `<circle cx="${x(i)}" cy="${y(v)}" r="${last ? 7 : 5}" fill="${last ? '#c8191f' : '#fff'}" stroke="#c8191f" stroke-width="2.5"><title>Year ${sems[i].year}, Semester ${sems[i].sem}: ${Calc.fmt(v)}</title></circle>${last || v === best ? `<text x="${x(i)}" y="${y(v) - 12}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c8191f">${Calc.fmt(v)}</text>` : ''}`; }).join('')}
    ${years.map(yr => { const idx = sems.map((s, i) => s.year === yr ? i : -1).filter(i => i >= 0); const cx = (x(idx[0]) + x(idx[idx.length - 1])) / 2; return `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="12.5" fill="#5b6475">Year ${yr}</text>`; }).join('')}
  </svg>`;
};

  const overall = Calc.overall(user.id), credits = Calc.credits(user.id), pct = Math.min(100, Math.round(credits / 120 * 100));
  let body;
  if (sem) {
    body = `<div class="card soft" style="margin:12px 0"><div class="row between"><div><div class="muted small">GPA for Year ${sem.year}, Semester ${sem.sem}</div><div style="font-size:1.9rem;font-weight:800">${Calc.fmt(Calc.semGpa(sem))}</div></div>

    <div class="grid g2" style="margin-bottom:14px">
      <div class="stat"><div class="lbl">Your overall GPA</div><div class="num">${Calc.fmt(overall)}</div><div class="sub good">${overall != null ? '✓ Official, certified by the school' : 'Not certified yet'}</div></div>
      <div class="stat"><div class="lbl">Credits earned</div><div class="num">${credits} <span class="muted" style="font-size:1rem;font-weight:400">of 120</span></div><div class="progress" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>

UI.onSubmit('saveProject', form => {
  const user = Session.user(), d = UI.formData(form), errs = {}, id = form.dataset.id;
  if (!d.name.trim()) errs.name = 'Give your project a name.';
  const fixUrl = (u, field, label) => { u = u.trim(); if (!u) return ''; const full = /^https?:\/\//i.test(u) ? u : 'https://' + u; try { const x = new URL(full); if (!x.hostname.includes('.')) throw 0; return full; } catch (e) { errs[field] = `Enter a full web address for ${label}, like https://github.com/you/project.`; return u; } };
  const liveUrl = fixUrl(d.liveUrl, 'liveUrl', 'the live version'), codeUrl = fixUrl(d.codeUrl, 'codeUrl', 'the code');
  const ts = Math.max(1, Math.min(50, parseInt(d.teamSize, 10) || 1));
  if (Object.keys(errs).length) return UI.showErrors(form, errs);
  const rec = { name: d.name.trim(), kind: d.kind, team: ts > 1 ? `Team of ${ts}` : 'Solo', goal: d.goal.trim(), challenge: d.challenge.trim(), role: d.role.trim(), result: d.result.trim(), liveUrl, codeUrl };
  if (id) Object.assign(Store.state.projects.find(p => p.id === id), rec);
  else Store.state.projects.push({ id: Store.id('p'), userId: user.id, comments: [], ...rec });
  Store.save(); UI.clearDrafts('project-form'); UI.toast(id ? 'Project saved.' : 'Project added.'); UI.go('/student/projects');
});
UI.on('deleteProject', el => UI.confirm('Remove this project?', 'It will disappear from your portfolio. This cannot be undone.', 'Remove project', () => {
  Store.state.projects = Store.state.projects.filter(p => p.id !== el.dataset.id); Store.save(); UI.toast('Project removed.'); UI.go('/student/projects');

SV.activities = ({ user, query }) => {
  const st = UI.state('acts', { filter: 'all', year: 'all', adding: false, editId: null, open: {} });
  if (query.add === '1' && !st.adding) { st.adding = true; st.editId = null; }
  const all = Q.acts(user.id);
  const count = t => all.filter(a => t === 'all' || a.type === t).length;
  const verified = all.filter(a => a.status === 'verified').length;
  const shown = all.filter(a => (st.filter === 'all' || a.type === st.filter) && (st.year === 'all' || a.year === Number(st.year)))
    .sort((a, b) => b.year - a.year || b.createdAt.localeCompare(a.createdAt));
  const canAdd = Session.can('add_activities');
  const rows = shown.map(a => {
    const comments = a.comments || [];
    const open = st.open[a.id];
    return `<div class="item" style="display:block"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:12px">
      <span class="dot">${Names.typeLetter[a.type]}</span>
      <div class="grow"><b>${esc(a.title)}</b><div class="muted small">${esc(Names.typeLabel[a.type])} · Year ${a.year}${a.detail ? ' · ' + esc(a.detail) : ''}</div>
        <div class="row" style="gap:12px;margin-top:4px">
          ${comments.length ? `<button class="btn link small" data-act="toggleActComments" data-id="${a.id}">💬 ${comments.length} comment${comments.length > 1 ? 's' : ''}</button>` : ''}
          ${a.certificate ? (a.certificate.data ? `<a class="small" href="${a.certificate.data}" download="${esc(a.certificate.name)}">📎 ${esc(a.certificate.name)}</a>` : `<span class="small muted">📎 ${esc(a.certificate.name)}</span>`) : ''}
          ${canAdd ? `<button class="btn link small" data-act="editAct" data-id="${a.id}">${a.status === 'evidence' ? 'Add evidence' : 'Edit'}</button><button class="btn link small" data-act="removeAct" data-id="${a.id}">Remove</button>` : ''}</div></div>
      <div>${SV.actStatus(a)}</div></div>
      ${a.status === 'evidence' ? `<div class="banner warn small" style="margin:8px 0 0 48px">${esc(a.evidenceNote || 'A teacher asked for evidence.')}</div>` : ''}
      ${open ? `<div style="margin:6px 0 0 48px">${comments.map(c => `<div class="comment"><b>${esc(Names.staff(Store.user(c.by)))}:</b> ${esc(c.text)}</div>`).join('')}</div>` : ''}</div>`;
  }).join('');

  const editing = st.editId && all.find(a => a.id === st.editId);
  const form = st.adding ? `<form class="card soft" id="act-form" data-submit="saveAct" novalidate style="margin-top:14px">
      <h3>${editing ? 'Edit activity' : 'Add an activity'}</h3>
      <div class="grid g2"><div><label class="field" for="af-type">What kind is it?</label><select class="input" id="af-type" name="type">${Object.keys(Names.typeShort).map(t => `<option value="${t}" ${editing && editing.type === t ? 'selected' : ''}>${t === 'achievement' ? 'School achievement' : t === 'leadership' ? 'Leadership role' : 'Extracurricular activity'}</option>`).join('')}</select></div>
      <div><label class="field" for="af-year">Which year?</label><select class="input" id="af-year" name="year">${[1, 2, 3, 4].map(y => `<option value="${y}" ${(editing ? editing.year : user.year) === y ? 'selected' : ''}>${y}</option>`).join('')}</select></div></div>
      <label class="field" for="af-title">What is it called?</label><input class="input" id="af-title" name="title" value="${esc(editing ? editing.title : '')}" placeholder="Debate society captain">
      <label class="field" for="af-detail">Where or what role? <span class="opt">(optional)</span></label><input class="input" id="af-detail" name="detail" value="${esc(editing ? editing.detail : '')}" placeholder="Students' union, 2 hours a week">
      <label class="field" for="af-cert">Attach a certificate <span class="opt">(optional, a picture or PDF under 250 KB is kept in this prototype)</span></label><input class="input" id="af-cert" name="cert" type="file" accept="image/*,.pdf">
      <div class="row" style="margin-top:14px"><button class="btn primary">Save activity</button><button type="button" class="btn" data-act="cancelAct">Cancel</button></div>
      <p class="hint">A teacher will check it before it shows as verified.</p></form>` : '';

  return wrapS(user, '/activities', `
    ${UI.crumbs([{ label: 'Home', href: '#/student' }, { label: 'My activities' }])}
    <div class="page-head"><div><h1>My activities</h1><p>Achievements, leadership roles and extracurricular activities, by year.</p></div>
      ${canAdd ? `<button class="btn primary" data-act="addAct">+ Add an activity</button>` : ''}</div>
    <p class="muted" style="margin:-4px 0 12px">${UI.plural(all.length, 'entry', 'entries')} in total, ${verified} checked by a teacher.</p>
    <div class="row between" style="margin-bottom:6px"><div class="tabs">${[['all', 'Everything'], ['achievement', 'Achievements'], ['leadership', 'Leadership'], ['extra', 'Extracurricular']].map(([k, l]) => `<button class="chip ${st.filter === k ? 'on' : ''}" data-act="actFilter" data-f="${k}">${l} (${count(k)})</button>`).join('')}</div>

    <div class="list">${rows || `<div style="margin-top:10px">${UI.empty(all.length ? 'Nothing matches that filter' : 'No entries yet', all.length ? 'Try another tab or year.' : 'Add your first achievement, leadership role or activity.')}</div>`}</div>

UI.on('removeAct', el => UI.confirm('Remove this entry?', 'It will be taken out of your record. This cannot be undone.', 'Remove', () => {

UI.onSubmit('saveAct', async form => {
  const user = Session.user(), st = UI.state('acts'), d = UI.formData(form), errs = {};
  if (!d.title.trim()) errs.title = 'Give this entry a name.';
  if (Object.keys(errs).length) return UI.showErrors(form, errs);
  const cert = await UI.readAttachment(d.cert);
  const S = Store.state;
  let a = st.editId && S.activities.find(x => x.id === st.editId);
  if (a) {
    Object.assign(a, { type: d.type, year: Number(d.year), title: d.title.trim(), detail: d.detail.trim(), status: 'waiting', updated: true, verifiedBy: null, evidenceNote: '' });
    if (cert) a.certificate = cert;
    Store.event(user.id, 'waiting', `${a.title} was updated and is waiting to be checked`, a.id);
  } else {
    a = { id: Store.id('a'), userId: user.id, type: d.type, year: Number(d.year), title: d.title.trim(), detail: d.detail.trim(), status: 'waiting', createdAt: new Date().toISOString(), certificate: cert, verifiedBy: null, comments: [], updated: false };
    S.activities.push(a);
    Store.event(user.id, 'waiting', `${a.title} is waiting to be checked`, a.id);
  }
  if (cert && cert.note) UI.toast(`The file ${cert.name} is ${cert.note}, so only its name was saved.`, true);
  Store.save(); st.adding = false; st.editId = null; UI.clearDrafts('act-form');
  UI.toast('Saved. A teacher will check it soon.');
  if (location.hash.includes('add=1')) location.hash = '#/student/activities'; else UI.render();
});

    }

    return `<div class="item" style="display:block"><div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><div><b>${esc(Names.staff(s))}${s.department ? ', ' + esc(s.department) : ''}</b>

        <label class="field" for="lf-staff">Who would you like to ask?</label><select class="input" id="lf-staff" name="staffId"><option value="">Choose a staff member</option>${staff.map(s => `<option value="${s.id}">${esc(Names.staff(s))}, ${esc(s.department)}</option>`).join('')}</select>
        <label class="field" for="lf-purpose">What is the letter for?</label><select class="input" id="lf-purpose" name="purpose">${Names.purposes.map(p => `<option>${p}</option>`).join('')}</select>
        <label class="field" for="lf-due">When do you need it by?</label><input class="input" id="lf-due" name="due" type="date" min="${UI.today()}"><div class="hint">Give your writer at least two weeks.</div>

        <div class="field" style="margin-top:14px">What can your writer see?</div>
        ${[['grades', 'My grades'], ['achievements', 'My achievements'], ['leadership', 'My leadership roles'], ['extracurricular', 'My extracurricular activities']].map(([k, l]) => `<label class="check"><input type="checkbox" name="share_${k}" checked> ${l}</label>`).join('')}
        <button class="btn primary block" style="margin-top:16px">Send request</button>
      </form>` : `<div class="card"><p class="muted">Asking for letters is switched off for students at the moment.</p></div>`}

  `);

UI.on('askSomeoneElse', el => {
  const l = Store.state.letters.find(x => x.id === el.dataset.id);
  UI.drafts['letter-form'] = { staffId: '', purpose: l.purpose, due: l.due >= UI.today() ? l.due : '', message: l.message || '' };
  UI.render(); const f = $('#letter-form'); if (f) { f.scrollIntoView({ block: 'center' }); $('#lf-staff').focus(); }
});
UI.onSubmit('sendLetter', form => {
  const user = Session.user(), d = UI.formData(form), errs = {};
  if (!d.staffId) errs.staffId = 'Choose who you would like to ask.';
  if (!d.due) errs.due = 'Choose the date you need the letter by.';
  else if (d.due < UI.today()) errs.due = 'That date has passed. Choose a date in the future.';
  if (Object.keys(errs).length) return UI.showErrors(form, errs);
  const S = Store.state, staff = Store.user(d.staffId);
  S.letters.push({ id: Store.id('l'), studentId: user.id, staffId: d.staffId, purpose: d.purpose, due: d.due, message: d.message.trim(),

    status: 'new', createdAt: new Date().toISOString(), changesUsed: 0, changeRequests: [], draft: '', versions: [] });
  Store.save(); UI.clearDrafts('letter-form');
  UI.toast(UI.daysUntil(d.due) < 14 ? `Sent to ${Names.staff(staff)}. That is under two weeks, so they may not manage it in time.` : `Request sent to ${Names.staff(staff)}.`);
  UI.render();
});

UI.onSubmit('postComment', form => {

  (item.comments = item.comments || []).push({ by: user.id, text, ts: new Date().toISOString() });

UI.onSubmit('saveAssessment', form => {
  const user = Session.user(), d = UI.formData(form), sid = form.dataset.sid;

  const S = Store.state; let a = S.assessments.find(x => x.studentId === sid && x.staffId === user.id);
  const rec = { leadership: r('leadership'), teamwork: r('teamwork'), communication: r('communication'), feedback: d.feedback.trim(), ts: new Date().toISOString() };
  if (a) Object.assign(a, rec); else S.assessments.push({ id: Store.id('as'), studentId: sid, staffId: user.id, ...rec });
  Store.event(sid, 'assessment', `${Names.staff(user)} added feedback about you`, null);
  Store.save(); UI.clearDrafts('assess-form'); UI.toast('Assessment saved.'); UI.render();
});

TV.letters = ({ user }) => {
  const st = UI.state('sl', { tab: 'new', declineId: null });
  const mine = Store.state.letters.filter(l => l.staffId === user.id);
  const tabs = [['new', 'New', mine.filter(l => l.status === 'new')], ['changes', 'Changes requested', mine.filter(l => l.status === 'changes')], ['progress', 'In progress', mine.filter(l => l.status === 'progress')], ['ready', 'Sent', mine.filter(l => l.status === 'ready')]];
  const cur = tabs.find(t => t[0] === st.tab) || tabs[0];
  const canWrite = Session.can('write_letters');
  const empty = { new: ['No new requests', 'When a student asks you for a letter it will show here, so you can accept or decline it.'], changes: ['No changes requested', 'If a student asks you to update a letter you sent, it will show here.'], progress: ['Nothing in progress', 'Accept a new request and it will move here, ready for you to write.'], ready: ['No letters sent yet', 'Letters you sign and send will be listed here.'] }[cur[0]];
  const card = (l) => {
    const s = Store.user(l.studentId);
    const head = `<div class="row between" style="align-items:flex-start"><div class="row" style="gap:12px">${UI.avatar(s)}<div><b>${esc(s.name)}</b><div class="muted small">${esc(l.purpose)}${l.status === 'changes' ? ` · Change request ${l.changesUsed} of ${CONFIG.maxLetterChanges}` : ''}</div></div></div>
      <div class="small">${l.status === 'changes' ? '<span class="status info">✎ Changes requested</span>' : l.status === 'ready' ? `<span class="muted">Sent ${UI.fmtDate(l.versions[l.versions.length - 1].sentAt)} · v${l.versions.length}</span>` : UI.dueLabel(l.due)}</div></div>`;
    let body = '';
    if (l.status === 'new') {
      body = `${l.message ? `<div class="card soft" style="padding:9px 12px;margin-top:10px"><span class="muted small">Message from student:</span> ${esc(l.message)}</div>` : ''}
        ${st.declineId === l.id ? `<form id="decline-form" data-submit="declineLetter" data-id="${l.id}" novalidate class="card soft" style="margin-top:10px"><h3>If you decline, tell ${esc(s.name.split(' ')[0])} why, so they can ask someone else</h3>
          <textarea class="input" name="reason" placeholder="I am on leave until December and cannot meet your deadline." style="min-height:62px"></textarea><div class="hint">A short reason is required before the reply can be sent.</div>
          <div class="row" style="margin-top:8px"><button class="btn primary small">Send reply</button><button type="button" class="btn small" data-act="cancelDecline">Cancel</button></div></form>`
        : canWrite ? `<div class="row" style="margin-top:10px"><button class="btn primary" data-act="acceptLetter" data-id="${l.id}">Accept</button><button class="btn" data-act="declineOpen" data-id="${l.id}">Decline</button></div>` : '<p class="muted small" style="margin-top:8px">Writing letters is switched off for your role.</p>'}`;
    } else if (l.status === 'changes') {
      const cr = l.changeRequests[l.changeRequests.length - 1];
      body = `<div class="card" style="padding:9px 12px;margin-top:10px"><span class="muted small">What ${esc(s.name.split(' ')[0])} wants changed:</span> ${esc(cr.text)}</div>${canWrite ? `<a class="btn primary" style="margin-top:10px" href="#/staff/letters/update/${l.id}">Update letter</a>` : ''}`;
    } else if (l.status === 'progress') {
      body = `${l.message ? `<div class="card soft" style="padding:9px 12px;margin-top:10px"><span class="muted small">Message from student:</span> ${esc(l.message)}</div>` : ''}${l.draft ? '<p class="small warn" style="margin-top:8px">● You have a saved draft.</p>' : ''}${canWrite ? `<a class="btn primary" style="margin-top:10px" href="#/staff/letters/write/${l.id}">${l.draft ? 'Continue writing' : 'Write letter'}</a>` : ''}`;
    } else {
      body = `<button class="btn small" style="margin-top:10px" data-act="viewLetter" data-id="${l.id}">View sent letter</button>`;
    }
    return `<div class="card" style="margin-top:12px">${head}${body}</div>`;
  };
  return wrapT(user, '/letters', `
    ${UI.crumbs([{ label: 'Home', href: '#/staff' }, { label: 'Letter requests' }])}
    <div class="page-head"><div><h1>Letter requests</h1><p>Accept or decline requests, then write and send each letter.</p></div></div>
    <div class="tabs">${tabs.map(([k, l, arr]) => `<button class="chip ${cur[0] === k ? 'on' : ''}" data-act="letterTab" data-tab="${k}">${l} (${arr.length})</button>`).join('')}</div>
    ${cur[2].sort((a, b) => a.due.localeCompare(b.due)).map(card).join('') || `<div style="margin-top:14px">${UI.empty(...empty)}</div>`}`);
};
UI.on('letterTab', el => { const s = UI.state('sl'); s.tab = el.dataset.tab; s.declineId = null; UI.render(); });
UI.on('declineOpen', el => { UI.state('sl').declineId = el.dataset.id; UI.render(); const t = $('#decline-form textarea'); if (t) t.focus(); });

UI.onSubmit('declineLetter', form => {

/* =================== LETTER EDITOR (write + update) =================== */
TV.editor = (mode) => ({ user, params }) => {
  const l = Store.state.letters.find(x => x.id === params[0] && x.staffId === user.id);
  const wantStatus = mode === 'write' ? 'progress' : 'changes';
  if (!l || l.status !== wantStatus || !Session.can('write_letters')) {
    return wrapT(user, '/letters', `<div style="margin-top:30px">${UI.empty('This letter is not open for editing', 'It may already be sent, or it is not assigned to you.')}<p style="margin-top:12px;text-align:center"><a class="btn" href="#/staff/letters">Back to requests</a></p></div>`);
  }
  const s = Store.user(l.studentId), first = s.name.split(' ')[0];
  const latest = l.versions[l.versions.length - 1];
  const tplName = TV.templateFor(l.purpose);
  const text = l.draft || (mode === 'update' ? latest.text : TV.letterTemplates[tplName](s.name, Names.staff(user)));
  const cr = l.changeRequests[l.changeRequests.length - 1];

UI.onChange('tplChange', el => {

UI.onSubmit('saveNote', form => {
  const user = Session.user(), d = UI.formData(form), att = Q.attachment(form.dataset.sid), w = Q.attachmentWeek(att);
  const r = k => d[k] ? Number(d[k]) : null;
  if (!Session.can('progress_notes')) return UI.toast('Your role cannot write progress notes.', true);
  if (!r('punctuality') && !r('quality') && !r('teamwork') && !d.text.trim()) return UI.showErrors(form, { text: 'Give at least one rating or write a note.' });

    <form id="import-form" data-submit="doImport" novalidate>
      <label class="field" for="im-file">CSV file</label><input class="input" id="im-file" name="file" type="file" accept=".csv,text/csv">
      <div class="hint"><a href="#" data-act="sampleCsv">Download a sample file</a></div>
      <div class="row" style="margin-top:14px"><button class="btn primary">Import</button><button type="button" class="btn" data-act="closeModal">Cancel</button></div></form><div id="import-result"></div>`);

UI.on('sampleCsv', () => UI.download('students-sample.csv', UI.csv([['schoolId', 'name', 'email', 'programme', 'year'], ['260101', 'Ada Moyo', `ada.moyo@${CONFIG.studentEmailDomain}`, 'BSc Computer Science', 1], ['260102', 'Ben Dube', `ben.dube@${CONFIG.studentEmailDomain}`, 'BA Communication', 1]]), 'text/csv'));
UI.onSubmit('doImport', form => {
  const f = form.elements.file.files[0];
  if (!f) return UI.showErrors(form, { file: 'Choose a CSV file first.' });
  const reader = new FileReader();
  reader.onload = () => {
    const rows = UI.parseCsv(String(reader.result).replace(/^﻿/, ''));
    const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
    const idx = k => head.indexOf(k);
    if (['schoolid', 'name', 'email'].some(k => idx(k) < 0)) return UI.showErrors(form, { file: 'The first row must include the columns schoolId, name and email.' });
    const S = Store.state; let added = 0, skipped = 0; const bad = [];
    rows.forEach((r, i) => {
      const rec = { schoolId: (r[idx('schoolid')] || '').trim(), name: (r[idx('name')] || '').trim(), email: (r[idx('email')] || '').trim(), programme: idx('programme') >= 0 ? (r[idx('programme')] || '').trim() : '', year: idx('year') >= 0 ? parseInt(r[idx('year')], 10) || 1 : 1 };
      if (!/^\d{6}$/.test(rec.schoolId)) return bad.push(`Row ${i + 2}: school ID "${rec.schoolId}" should look like 260101`);
      if (!rec.name) return bad.push(`Row ${i + 2}: name is missing`);
      if (!/^\S+@\S+\.\S+$/.test(rec.email)) return bad.push(`Row ${i + 2}: email "${rec.email}" is not valid`);
      if (rec.year < 1 || rec.year > 4) return bad.push(`Row ${i + 2}: year must be 1 to 4`);
      if (S.registry.some(x => x.schoolId === rec.schoolId) || S.users.some(u => u.schoolId === rec.schoolId)) return skipped++;
      S.registry.push(rec); added++;
    });
    Store.log(`Imported ${added} student record${added === 1 ? '' : 's'} from a file`, Session.user().name); Store.save();
    form.classList.add('hidden');
    $('#import-result').innerHTML = `<div class="banner ${bad.length && !added ? 'err' : 'ok'}"><b>${added} imported</b>${skipped ? `, ${skipped} skipped (already on file)` : ''}${bad.length ? `, ${bad.length} with problems` : ''}.</div>
      ${bad.length ? `<ul class="small bad" style="margin:10px 0 0 18px">${bad.slice(0, 8).map(b => `<li>${esc(b)}</li>`).join('')}${bad.length > 8 ? `<li>…and ${bad.length - 8} more</li>` : ''}</ul>` : ''}<div style="margin-top:14px"><button class="btn" data-act="closeModal">Close</button></div>`;
  };
  reader.readAsText(f);
});

AV.permDiff = (draft) => {
  const saved = Store.state.permissions, out = [];
